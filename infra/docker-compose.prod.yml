# Staging / production stack. Lives on the server at /opt/onlinedars next to .env
# (template: infra/docker/prod.env.example). Normally driven by infra/scripts/deploy.sh:
#   IMAGE_TAG=<sha|vX.Y.Z> docker compose -f docker-compose.prod.yml up -d
# Only Caddy publishes ports. Postgres, Redis and MinIO sit on an internal-only network.

name: onlinedars

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  env_file: .env
  restart: unless-stopped
  logging: *logging
  networks: [edge, internal]
  security_opt: ["no-new-privileges:true"]

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      FILES_DOMAIN: ${FILES_DOMAIN:?set FILES_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/fox3mr3ygu3/onlinedars}-web:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/fox3mr3ygu3/onlinedars}-api:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      PORT: "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/fox3mr3ygu3/onlinedars}-worker:${IMAGE_TAG:?set IMAGE_TAG}
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: "256m"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # One-shot: `docker compose run --rm migrate` (deploy.sh does this before `up`).
  migrate:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/fox3mr3ygu3/onlinedars}-api:${IMAGE_TAG:?set IMAGE_TAG}
    restart: "no"
    profiles: [tools]
    networks: [internal]
    entrypoint: []
    command: ["prisma", "migrate", "deploy", "--schema", "prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    shm_size: "256m"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # AOF so queued BullMQ jobs (certificates, payment re-checks) survive a restart.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    # MinIO stopped publishing community images in late 2025; this is the last pinned release
    # we use. Override with MINIO_IMAGE, or move to provider S3 (see docs/DECISIONS.md).
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: unless-stopped
    logging: *logging
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    # On edge too so Caddy can serve FILES_DOMAIN (presigned downloads). The console (9001) is not proxied.
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket if missing. Safe to re-run.
  minio-init:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: "no"
    networks: [internal]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$S3_BUCKET"
    depends_on:
      minio:
        condition: service_healthy

networks:
  edge: {}
  # No outbound internet and no published ports for the data services.
  internal:
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
